; HIRI Firmware — ESP32 / ESP8266 optimized MQTT to Home Assistant
[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.0
  adafruit/DHT sensor library@^1.4.6

[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags = -DHIRI_BOARD_ESP32

[env:esp8266]
platform = espressif8266
board = nodemcuv2
build_flags = -DHIRI_BOARD_ESP8266

; TLS MQTT build (secure)
[env:esp32dev-tls]
platform = espressif32
board = esp32dev
build_flags =
  -DHIRI_BOARD_ESP32
  -DHIRI_MQTT_TLS=1
  -DHIRI_MQTT_TLS_PORT=8883

; Deep sleep + battery build (low power)
[env:esp32dev-lp]
platform = espressif32
board = esp32dev
build_flags =
  -DHIRI_BOARD_ESP32
  -DHIRI_DEEP_SLEEP_ENABLED=1
  -DHIRI_DEEP_SLEEP_SECONDS=300
  -DHIRI_BATTERY_ENABLED=1
